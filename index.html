<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixFlex - Stream TV Shows & Movies</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #fff;
            user-select: none;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            transition: background-color 0.5s ease;
        }

        .navbar.scrolled {
            background-color: #141414;
        }

        .nav-logo {
            color: #E50914;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            margin-right: auto;
            margin-left: 30px;
        }

        .nav-links a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            font-weight: 500;
        }

        .nav-profile {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #1ed760;
            cursor: pointer;
        }

        /* Hero Banner */
        .banner {
            position: relative;
            height: 85vh;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 30%, rgba(0,0,0,0.2) 100%), 
                        url('https://unsplash.com') no-repeat center center/cover;
            display: flex;
            align-items: center;
            padding-left: 4%;
            margin-bottom: 20px;
        }

        .banner-content {
            max-width: 600px;
            z-index: 10;
        }

        .banner-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .banner-description {
            font-size: 1.2rem;
            line-height: 1.4;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #e5e5e5;
        }

        .banner-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            cursor: pointer;
            border: none;
            outline: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .btn-play {
            background-color: #fff;
            color: #000;
        }

        .btn-play:hover {
            background-color: rgba(255,255,255,0.75);
        }

        .btn-info {
            background-color: rgba(109, 109, 110, 0.7);
            color: #fff;
        }

        .btn-info:hover {
            background-color: rgba(109, 109, 110, 0.4);
        }

        .banner-fadeBottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 7.4rem;
            background-image: linear-gradient(180deg, transparent, rgba(37,37,37,0.61), #111);
        }

        /* Movie Rows */
        .row {
            padding: 0 4%;
            margin-bottom: 40px;
        }

        .row-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }

        .row-posters {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 10px;
            padding: 10px 0;
        }

        /* Hide scrollbar */
        .row-posters::-webkit-scrollbar {
            display: none;
        }
        .row-posters {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .poster {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 4px;
            transition: transform 0.45s;
            cursor: pointer;
        }

        .poster:hover {
            transform: scale(1.08);
            opacity: 1;
        }

        .poster-large {
            max-height: 320px;
        }

        .poster-large:hover {
            transform: scale(1.1);
        }

        /* Footer */
        .footer {
            max-width: 1000px;
            margin: 80px auto 0 auto;
            padding: 0 4% 40px 4%;
            color: #808080;
            font-size: 13px;
        }

        .footer-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            list-style: none;
            margin-bottom: 30px;
        }

        .footer-links a {
            color: #808080;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Responsive UI */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .banner-title { font-size: 2.2rem; }
            .banner-description { font-size: 1rem; }
            .footer-links { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar" id="navbar">
        <a href="#" class="nav-logo">FLIXFLEX</a>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">TV Shows</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="#">New & Popular</a></li>
            <li><a href="#">My List</a></li>
        </ul>
        <div class="nav-profile"></div>
    </nav>

    <!-- Main Spotlight Banner -->
    <header class="banner">
        <div class="banner-content">
            <h1 class="banner-title">Stranger Elements</h1>
            <p class="banner-description">When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.</p>
            <div class="banner-buttons">
                <button class="btn btn-play">▶ Play</button>
                <button class="btn btn-info">ⓘ More Info</button>

        </div>
        <div class="banner-fadeBottom"></div>
    </header>

    <!-- Content Rows -->
    <main>
        <!-- Row 1: Originals (Large Layout) -->
        <section class="row">

            <div class="row-posters">
                <img class="poster poster-large" src="https://unsplash.com" alt="Original 1">

                <img class="poster poster-large" src="https://unsplash.com" alt="Original 3">
                <img class="poster poster-large" src="https://unsplash.com" alt="Original 4">
                <img class="poster poster-large" src="https://unsplash.com" alt="Original 5">
                <img class="poster poster-large" src="https://unsplash.com" alt="Original 6">
            </div>
        </section>

        <!-- Row 2: Trending -->
        <section class="row">
            <h2 class="row-title">Trending Now</h2>
            <div class="row-posters">
                <img class="poster" src="https://unsplash.com" alt="Trending 1">
                <img class="poster" src="https://unsplash.com" alt="Trending 2">
                <img class="poster" src="https://unsplash.com" alt="Trending 3">
                <img class="poster" src="https://unsplash.com" alt="Trending 4">
                <img class="poster" src="https://unsplash.com" alt="Trending 5">
                <img class="poster" src="https://unsplash.com" alt="Trending 6">
            </div>
        </section>

        <!-- Row 3: Action Movies -->
        <section class="row">
            <h2 class="row-title">Action & Adventure</h2>
            <div class="row-posters">
                <img class="poster" src="https://unsplash.com" alt="Action 1">
                <img class="poster" src="https://unsplash.com" alt="Action 2">
                <img class="poster" src="https://unsplash.com" alt="Action 3">
